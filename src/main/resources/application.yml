spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# Development key only; set JWT_SECRET for deployment (at least 32 UTF-8 bytes).
jwt-secret: ${JWT_SECRET:identity-service-demo-key-256-bits!}
jwt-expiration: 3600000
